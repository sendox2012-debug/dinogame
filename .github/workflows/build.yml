name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential \
            wget curl ca-certificates lld m4

      - name: Install Python dependencies
        run: pip install buildozer cython

      - name: Force NDK r25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          if [ ! -d ~/.buildozer/android/platform/android-ndk-r25b ]; then
            echo "Downloading NDK r25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d ~/.buildozer/android/platform/
            rm /tmp/ndk.zip
          fi
          # Проверяем что распаковалось
          ls ~/.buildozer/android/platform/

      - name: Build APK (Fixed NDK Path)
        run: |
          # Запускаем сборку, явно указывая путь к нашему NDK r25b
          # Это перебивает внутренние настройки buildozer
          export ANDROIDNDKVER=r25b
          export P4A_NDK_DIR=$HOME/.buildozer/android/platform/android-ndk-r25b
          
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InnovationDino-APK
          path: bin/*.apk
name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ДОБАВЛЕНЫ: libtool-bin, automake, m4 (они критически важны для Ubuntu 24.04)
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential \
            wget curl ca-certificates lld m4

      - name: Install Python dependencies
        run: pip install buildozer cython

      - name: Force NDK r25b via env
        run: |
          echo "ANDROIDNDKVER=r25b" >> $GITHUB_ENV
          echo "P4A_NDK_VERSION=25b" >> $GITHUB_ENV

      - name: Pre-download NDK r25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          if [ ! -d ~/.buildozer/android/platform/android-ndk-r25b ]; then
            echo "Downloading NDK r25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d ~/.buildozer/android/platform/
            rm /tmp/ndk.zip
            echo "NDK r25b installed successfully"
          else
            echo "NDK r25b already exists"
          fi
          ls ~/.buildozer/android/platform/ | grep ndk

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InnovationDino-APK
          path: bin/*.apk
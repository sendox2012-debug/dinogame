name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential \
            wget curl ca-certificates lld

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Force NDK r25b
        run: |
          mkdir -p ~/.buildozer/android/platform
          if [ ! -d ~/.buildozer/android/platform/android-ndk-r25b ]; then
            echo "Downloading NDK r25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d ~/.buildozer/android/platform/
            rm /tmp/ndk.zip
            echo "NDK r25b installed"
          else
            echo "NDK r25b already exists"
          fi
          ls -la ~/.buildozer/android/platform/

      - name: Verify buildozer.spec
        run: |
          echo "=== buildozer.spec contents ==="
          cat buildozer.spec
          echo "==============================="
          grep -n "ndk_version" buildozer.spec || echo "WARNING: ndk_version NOT FOUND in spec!"

      - name: Build APK
        run: |
          # pipefail гарантирует, что падение buildozer прервет шаг, несмотря на tee
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InnovationDino-APK
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
